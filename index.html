<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expanse Tracker</title>

<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<h2>Expense Tracker</h2>

<input id="username" placeholder="Enter Username">
<button id="login-btn">Login</button>

<form id="expense-form" style="display:none;">
<select id="type">
<option>Food</option>
<option>Travel</option>
<option>Shopping</option>
</select>

<input id="custom-type" placeholder="Custom Type">
<input type="date" id="date" required>
<input type="number" id="amount" required placeholder="Amount">

<button type="submit">Add Expense</button>
</form>

<h3>Budget</h3>
<input id="budget" type="number" placeholder="Set Budget">
<p>Remaining: ₹<span id="remaining">0</span></p>

<table id="expense-table">
<thead>
<tr>
<th>Type</th>
<th>Date</th>
<th>Amount</th>
<th>Action</th>
</tr>
</thead>
<tbody></tbody>
</table>

<h3>Total: ₹<span id="total">0</span></h3>

<button id="export-btn">Export</button>
<input type="file" id="import-file">
<button id="import-btn">Import</button>

<button id="dark-mode-btn">Dark Mode</button>

<canvas id="expense-chart"></canvas>
<canvas id="expense-bar"></canvas>

<table id="monthly-summary">
<thead>
<tr><th>Month</th><th>Total</th></tr>
</thead>
<tbody></tbody>
</table>

<script src="script.js"></script>
</body>
</html>
